name: Build Signed APK & Generate DAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Inject Signing Config into build.gradle
        run: |
          # Add signing config to app/build.gradle
          cat << 'EOF' >> app/build.gradle
          
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Extract SHA-256 & Generate assetlinks.json
        run: |
          FINGERPRINT=$(keytool -list -v -keystore app/release.keystore -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "SHA256:" | awk '{print $2}')
          
          mkdir -p .well-known output
          cat > .well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.alielfatih.mcquiz",
              "sha256_cert_fingerprints": ["$FINGERPRINT"]
            }
          }]
          EOF
          cp .well-known/assetlinks.json output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks.json
          path: output/assetlinks.json